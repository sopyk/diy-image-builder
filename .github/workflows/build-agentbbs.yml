name: Build AgentBBS Docker Images

on:
  schedule:
    - cron: '0 0 * * *'  # 每天 UTC 0 点（北京时间 8 点）
  workflow_dispatch:      # 支持手动触发

env:
  UPSTREAM_REPO: ruvnet/AgentBBS
  IMAGE_BASE: ghcr.io/${{ github.repository }}/agentbbs

permissions:
  packages: write

jobs:
  check-release:
    runs-on: ubuntu-latest
    outputs:
      new_release: ${{ steps.check.outputs.new_release }}
      latest_tag: ${{ steps.check.outputs.latest_tag }}
    
    steps:
      - name: Check upstream latest release
        id: check
        run: |
          LATEST_RELEASE=$(curl -s "https://api.github.com/repos/$UPSTREAM_REPO/releases/latest" | jq -r '.tag_name')
          
          if [ -z "$LATEST_RELEASE" ] || [ "$LATEST_RELEASE" = "null" ]; then
            echo "No latest release found"
            exit 1
          fi
          
          echo "Latest upstream release: $LATEST_RELEASE"
          echo "latest_tag=$LATEST_RELEASE" >> $GITHUB_OUTPUT
          
          # 检查 web target 镜像是否已存在
          PACKAGE_NAME=$(echo "${{ github.repository }}/agentbbs-web" | tr '[:upper:]' '[:lower:]')
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            "https://ghcr.io/v2/$PACKAGE_NAME/manifests/$LATEST_RELEASE")
          
          if [ "$HTTP_CODE" = "200" ]; then
            echo "Image tag $LATEST_RELEASE already exists, no action needed"
            echo "new_release=false" >> $GITHUB_OUTPUT
          else
            echo "New release detected: $LATEST_RELEASE"
            echo "new_release=true" >> $GITHUB_OUTPUT
          fi

  build-web:
    needs: check-release
    if: needs.check-release.outputs.new_release == 'true'
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout our repo (for custom Dockerfile)
        uses: actions/checkout@v4
        with:
          path: diy-image-builder

      - name: Checkout upstream release tag
        uses: actions/checkout@v4
        with:
          repository: ${{ env.UPSTREAM_REPO }}
          ref: ${{ needs.check-release.outputs.latest_tag }}
          path: upstream

      - name: Use our custom Dockerfile
        run: |
          cp diy-image-builder/dockerfiles/agentbbs/Dockerfile upstream/Dockerfile
          echo "Custom Dockerfile copied into upstream source"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_BASE }}-web
          tags: |
            type=raw,value=latest
            type=raw,value=${{ needs.check-release.outputs.latest_tag }}

      - name: Build and push (runtime-web)
        uses: docker/build-push-action@v6
        with:
          context: ./upstream
          file: ./upstream/Dockerfile
          target: runtime-web
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        run: |
          echo "✅ AgentBBS Web Docker image built!"
          echo "Image: ${{ env.IMAGE_BASE }}-web:latest"

  build-ssh:
    needs: check-release
    if: needs.check-release.outputs.new_release == 'true'
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout our repo (for custom Dockerfile)
        uses: actions/checkout@v4
        with:
          path: diy-image-builder

      - name: Checkout upstream release tag
        uses: actions/checkout@v4
        with:
          repository: ${{ env.UPSTREAM_REPO }}
          ref: ${{ needs.check-release.outputs.latest_tag }}
          path: upstream

      - name: Use our custom Dockerfile
        run: |
          cp diy-image-builder/dockerfiles/agentbbs/Dockerfile upstream/Dockerfile
          echo "Custom Dockerfile copied into upstream source"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_BASE }}-ssh
          tags: |
            type=raw,value=latest
            type=raw,value=${{ needs.check-release.outputs.latest_tag }}

      - name: Build and push (runtime-ssh)
        uses: docker/build-push-action@v6
        with:
          context: ./upstream
          file: ./upstream/Dockerfile
          target: runtime-ssh
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        run: |
          echo "✅ AgentBBS SSH Docker image built!"
          echo "Image: ${{ env.IMAGE_BASE }}-ssh:latest"
