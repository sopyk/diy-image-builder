name: Build OpenMAIC Docker Image

on:
  schedule:
    - cron: '0 0 * * *'  # 每天 UTC 0 点（北京时间 8 点）运行
  workflow_dispatch:      # 支持手动触发

env:
  UPSTREAM_REPO: THU-MAIC/OpenMAIC
  IMAGE_NAME: ghcr.io/${{ github.repository }}

permissions:
  packages: write

jobs:
  check-release:
    runs-on: ubuntu-latest
    outputs:
      new_release: ${{ steps.check.outputs.new_release }}
      latest_tag: ${{ steps.check.outputs.latest_tag }}
    
    steps:
      - name: Check upstream latest release
        id: check
        run: |
          # 获取上游最新正式 release（排除 pre-release）
          LATEST_RELEASE=$(curl -s "https://api.github.com/repos/$UPSTREAM_REPO/releases/latest" | jq -r '.tag_name')
          
          if [ -z "$LATEST_RELEASE" ] || [ "$LATEST_RELEASE" = "null" ]; then
            echo "No latest release found"
            exit 1
          fi
          
          echo "Latest upstream release: $LATEST_RELEASE"
          echo "latest_tag=$LATEST_RELEASE" >> $GITHUB_OUTPUT
          
          # 检查本仓库是否已有同名镜像(tag),有则跳过
          # 用 GHCR package API 判断
          PACKAGE_NAME=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            "https://ghcr.io/v2/$PACKAGE_NAME/manifests/$LATEST_RELEASE")
          
          if [ "$HTTP_CODE" = "200" ]; then
            echo "Image tag $LATEST_RELEASE already exists in GHCR, no action needed"
            echo "new_release=false" >> $GITHUB_OUTPUT
          else
            echo "New release detected: $LATEST_RELEASE (image tag does not exist yet)"
            echo "new_release=true" >> $GITHUB_OUTPUT
          fi

  build-docker:
    needs: check-release
    if: needs.check-release.outputs.new_release == 'true'
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout upstream release tag
        uses: actions/checkout@v4
        with:
          repository: ${{ env.UPSTREAM_REPO }}
          ref: ${{ needs.check-release.outputs.latest_tag }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=raw,value=${{ needs.check-release.outputs.latest_tag }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        run: |
          echo "✅ Docker image built and pushed!"
          echo ""
          echo "Image tags:"
          echo "- ${{ env.IMAGE_NAME }}:latest"
          echo "- ${{ env.IMAGE_NAME }}:${{ needs.check-release.outputs.latest_tag }}"
          echo ""
          echo "Pull command:"
          echo "\`\`\`bash"
          echo "docker pull ${{ env.IMAGE_NAME }}:latest"
          echo "\`\`\`"
