name: Build ArgyBargy Docker Image

on:
  schedule:
    - cron: '0 1 * * *'  # 每天 UTC 1 点（北京时间 9 点）
  workflow_dispatch:      # 支持手动触发

env:
  UPSTREAM_REPO: titusblair/argybargy
  IMAGE_NAME: ghcr.io/${{ github.repository }}/argybargy

permissions:
  packages: write

jobs:
  build-docker:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout upstream main branch
        uses: actions/checkout@v4
        with:
          repository: ${{ env.UPSTREAM_REPO }}
          ref: main

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        run: |
          echo "✅ ArgyBargy Docker image built and pushed!"
          echo ""
          echo "Image tags:"
          echo "- ${{ env.IMAGE_NAME }}:latest"
          echo ""
          echo "Pull command:"
          echo "\`\`\`bash"
          echo "docker pull ${{ env.IMAGE_NAME }}:latest"
          echo "\`\`\`"
