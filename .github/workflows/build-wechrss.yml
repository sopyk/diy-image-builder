name: Build WeRSS Docker Image

# WeRSS = johamwon/wechrss（微信公众号 → RSS）
# 上游不发布任何预构建镜像，故在此自建；
# 自定义 Dockerfile：不装 Playwright/Chromium（省 ~600 MB），见 dockerfiles/wechrss/Dockerfile
# 镜像：ghcr.io/sopyk/diy-image-builder/wechrss:latest / :sha-<上游短 SHA>

on:
  push:
    branches: [main]
    paths:
      - 'dockerfiles/wechrss/**'
      - '.github/workflows/build-wechrss.yml'
  schedule:
    - cron: '23 1 * * 3'   # 每周三 UTC 1:23（北京时间 9:23）
  workflow_dispatch:

env:
  UPSTREAM_REPO: johamwon/wechrss
  UPSTREAM_REF: main
  IMAGE_NAME: ghcr.io/sopyk/diy-image-builder/wechrss
  # GHCR registry API 里的包名（小写、不带域名）
  PACKAGE: sopyk/diy-image-builder/wechrss

permissions:
  contents: read
  packages: write

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.info.outputs.sha }}
      short: ${{ steps.info.outputs.short }}
      build: ${{ steps.info.outputs.build }}
    steps:
      - name: Resolve upstream commit and GHCR state
        id: info
        run: |
          set -euo pipefail

          SHA=$(curl -fsSL "https://api.github.com/repos/${UPSTREAM_REPO}/commits/${UPSTREAM_REF}" | jq -r .sha)
          SHORT=${SHA:0:7}
          echo "上游 ${UPSTREAM_REPO}@${UPSTREAM_REF} = ${SHORT}"
          echo "sha=${SHA}" >> "$GITHUB_OUTPUT"
          echo "short=${SHORT}" >> "$GITHUB_OUTPUT"

          TOKEN=$(curl -fsSL "https://ghcr.io/token?scope=repository:${PACKAGE}:pull&service=ghcr.io" | jq -r .token)
          CODE=$(curl -s -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer ${TOKEN}" \
            -H "Accept: application/vnd.oci.image.index.v1+json,application/vnd.docker.distribution.manifest.list.v2+json,application/vnd.docker.distribution.manifest.v2+json" \
            "https://ghcr.io/v2/${PACKAGE}/manifests/sha-${SHORT}" || true)
          echo "GHCR sha-${SHORT} 探测状态码: ${CODE}"

          # push / 手动触发一律重建（Dockerfile 或镜像本身可能变了）；
          # 只有定时任务才做「已存在则跳过」的幂等判断
          if [ "${{ github.event_name }}" = "schedule" ] && [ "${CODE}" = "200" ]; then
            echo "该版本镜像已存在，定时任务跳过构建"
            echo "build=false" >> "$GITHUB_OUTPUT"
          else
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: check
    if: needs.check.outputs.build == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout this repo (DIY Dockerfiles)
        uses: actions/checkout@v4
        with:
          path: builder

      - name: Checkout upstream wechrss source
        uses: actions/checkout@v4
        with:
          repository: ${{ env.UPSTREAM_REPO }}
          ref: ${{ env.UPSTREAM_REF }}
          path: upstream

      - name: Inject DIY Dockerfile
        run: |
          set -euo pipefail
          cp builder/dockerfiles/wechrss/Dockerfile upstream/Dockerfile
          echo "上游版本: $(cat upstream/VERSION 2>/dev/null || echo unknown)"
          grep -n 'INSTALL_CHROMIUM\|FROM' upstream/Dockerfile

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./upstream
          file: ./upstream/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:sha-${{ needs.check.outputs.short }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ env.UPSTREAM_REPO }}
            org.opencontainers.image.version=${{ needs.check.outputs.sha }}
          cache-from: type=gha,scope=wechrss
          cache-to: type=gha,mode=max,scope=wechrss

      - name: Summary
        run: |
          echo "✅ wechrss 镜像已推送（上游 ${UPSTREAM_REPO}@${SHORT}）"
          echo ""
          echo "| 项目 | 值 |"
          echo "|---|---|"
          echo "| 上游 commit | \`${{ needs.check.outputs.sha }}\` |"
          echo "| 镜像 | \`${{ env.IMAGE_NAME }}:latest\` |"
          echo "| 版本 tag | \`sha-${{ needs.check.outputs.short }}\` |"
          echo ""
          echo '```bash'
          echo "docker pull ${{ env.IMAGE_NAME }}:latest"
          echo '```'
        env:
          SHORT: ${{ needs.check.outputs.short }}
