name: Build WeRSS Docker Image

# WeRSS = johamwon/wechrss（微信公众号 → RSS）
# 上游不发布任何预构建镜像，故在此自建；
# 自定义 Dockerfile：不装 Playwright/Chromium（省 ~600 MB），见 dockerfiles/wechrss/Dockerfile
# 镜像：ghcr.io/sopyk/diy-image-builder/wechrss:latest / :sha-<上游短 SHA>

on:
  push:
    branches: [main]
    paths:
      - 'dockerfiles/wechrss/**'
      - '.github/workflows/build-wechrss.yml'
  schedule:
    - cron: '23 1 * * 3'   # 每周三 UTC 1:23（北京时间 9:23）
  workflow_dispatch:

env:
  UPSTREAM_REPO: johamwon/wechrss
  UPSTREAM_REF: main
  IMAGE_NAME: ghcr.io/sopyk/diy-image-builder/wechrss

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout this repo (DIY Dockerfile)
        uses: actions/checkout@v4
        with:
          path: builder

      - name: Checkout upstream wechrss source
        uses: actions/checkout@v4
        with:
          repository: ${{ env.UPSTREAM_REPO }}
          ref: ${{ env.UPSTREAM_REF }}
          path: upstream

      - name: Read upstream commit
        id: info
        run: |
          set -euo pipefail
          SHA=$(git -C upstream rev-parse HEAD)
          SHORT=$(git -C upstream rev-parse --short=7 HEAD)
          echo "上游 ${UPSTREAM_REPO}@${UPSTREAM_REF} = ${SHORT}（VERSION $(cat upstream/VERSION 2>/dev/null || echo unknown)）"
          echo "sha=${SHA}"  >> "$GITHUB_OUTPUT"
          echo "short=${SHORT}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check whether this version already exists in GHCR
        id: exists
        run: |
          set -euo pipefail
          TAG="sha-${{ steps.info.outputs.short }}"
          if docker manifest inspect "${IMAGE_NAME}:${TAG}" > /dev/null 2>&1; then
            echo "${IMAGE_NAME}:${TAG} 已存在"
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "${IMAGE_NAME}:${TAG} 不存在，需要构建"
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Inject DIY Dockerfile
        run: |
          set -euo pipefail
          cp builder/dockerfiles/wechrss/Dockerfile upstream/Dockerfile
          echo "--- 生效的 Dockerfile 头部 ---"
          grep -nE '^(FROM|ARG|RUN|CMD)' upstream/Dockerfile

      - name: Build and push
        # 定时任务只在镜像不存在时构建；push / 手动触发一律重建（Dockerfile 可能已改）
        if: github.event_name != 'schedule' || steps.exists.outputs.exists == 'false'
        uses: docker/build-push-action@v6
        with:
          context: ./upstream
          file: ./upstream/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:sha-${{ steps.info.outputs.short }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ env.UPSTREAM_REPO }}
            org.opencontainers.image.version=${{ steps.info.outputs.sha }}
          cache-from: type=gha,scope=wechrss
          cache-to: type=gha,mode=max,scope=wechrss

      - name: Summary
        run: |
          echo "### WeRSS 构建结果" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| 项目 | 值 |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          echo "| 上游 commit | \`${{ steps.info.outputs.sha }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| 版本 tag | \`sha-${{ steps.info.outputs.short }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| 是否已存在 | ${{ steps.exists.outputs.exists }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo '```bash' >> "$GITHUB_STEP_SUMMARY"
          echo "docker pull ${IMAGE_NAME}:latest" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
