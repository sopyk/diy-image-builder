name: Build wechrss-fulltext Docker Image

# wechrss 全文补全中间层（自研组件，源码 = dockerfiles/wechrss-fulltext/app.py）
# 用途：给 wechrss 的 feed 补正文，输出带 content:encoded 的全文 RSS
# 镜像：ghcr.io/sopyk/diy-image-builder/wechrss-fulltext:latest / :sha-<本仓库短 SHA>

on:
  push:
    branches: [main]
    paths:
      - 'dockerfiles/wechrss-fulltext/**'
      - '.github/workflows/build-wechrss-fulltext.yml'
  schedule:
    - cron: '41 1 * * 3'   # 每周三 UTC 1:41（北京时间 9:41），仅为保险
  workflow_dispatch:

env:
  IMAGE_NAME: ghcr.io/sopyk/diy-image-builder/wechrss-fulltext

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout this repo
        uses: actions/checkout@v4

      - name: Short SHA
        id: sha
        run: echo "short=${GITHUB_SHA:0:7}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./dockerfiles/wechrss-fulltext
          file: ./dockerfiles/wechrss-fulltext/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:sha-${{ steps.sha.outputs.short }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.description=Full-text RSS layer for wechrss
          cache-from: type=gha,scope=wechrss-fulltext
          cache-to: type=gha,mode=max,scope=wechrss-fulltext

      - name: Summary
        run: |
          echo "✅ wechrss-fulltext 镜像已推送"
          echo ""
          echo "\`${{ env.IMAGE_NAME }}:latest\`"
          echo ""
          echo '```bash'
          echo "docker pull ${{ env.IMAGE_NAME }}:latest"
          echo '```'
